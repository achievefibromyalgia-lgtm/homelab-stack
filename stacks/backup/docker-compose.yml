services:
  duplicati:
    image: lscr.io/linuxserver/duplicati:2.0.8
    container_name: duplicati
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Asia/Singapore}
    volumes:
      - duplicati-config:/config
      - duplicati-backups:/backups
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - "traefik.http.routers.duplicati.rule=Host(`backup.${DOMAIN}`)"
      - traefik.http.routers.duplicati.entrypoints=websecure
      - traefik.http.routers.duplicati.tls=true
      - traefik.http.services.duplicati.loadbalancer.server.port=8200
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  restic-rest-server:
    image: restic/rest-server:0.13.0
    container_name: restic-rest-server
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - RESTIC_PASSWORD=${RESTIC_PASSWORD:-changeme}
    volumes:
      - restic-data:/data
    ports:
      - "8275:8080"
    labels:
      - traefik.enable=true
      - "traefik.http.routers.restic.rule=Host(`restic.${DOMAIN}`)"
      - traefik.http.routers.restic.entrypoints=websecure
      - traefik.http.routers.restic.tls=true
      - traefik.http.services.restic.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  proxy:
    external: true

volumes:
  duplicati-config:
  duplicati-backups:
  restic-data: